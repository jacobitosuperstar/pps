networks:
  server_network:

services:
  # Backend - FastAPI
  backend:
    build:
      context: ./RestAPI
      dockerfile: ./Dockerfile
    expose:
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - /app/.venv/
      - ./RestAPI/:/app/
    env_file:
      - ./pps.env
    networks:
      - server_network
  # Frontend App
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "5173:5173"
    expose:
      - "5173"
    networks:
      - server_network
    volumes:
      - ./frontend/:/app/
    command: >
      sh -c "
      npm run dev
      "
    depends_on:
      - backend
